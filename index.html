<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Sudoku — Thử thách trí tuệ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202b40;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #4569e8;
      --blue-dark: #3455ce;
      --stat-ink: #26344c;
      --line: #dce3ef;
      --muted: #7c879b;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 8px 2px calc(64px + env(safe-area-inset-bottom));
      overflow: hidden;
      background: #f4f7fb;
    }
    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    .app { width: min(100%, 720px); height: calc(100vh - 72px - env(safe-area-inset-bottom)); height: calc(100dvh - 72px - env(safe-area-inset-bottom)); min-height: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 2px; }
    .topbar-button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: #7283cf;
      background: transparent;
      font-size: 24px;
    }
    .topbar-button:hover { background: #eef2ff; }
    .info-bar {
      display: grid;
      min-height: 44px;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
    }
    .stat { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; gap: 1px; white-space: nowrap; }
    .info-bar .stat:nth-child(2) { align-items: center; }
    .stat-label { color: var(--stat-ink); font-size: 10px; font-weight: 650; letter-spacing: .04em; }
    .stat-value { overflow: hidden; color: var(--stat-ink); font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .stat-value.bad { color: var(--stat-ink); }
    .info-controls {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-end;
      justify-self: end;
    }
    .timer-row {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      color: var(--stat-ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .timer-row svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .timer-row #timer { font-size: 14px; font-weight: 700; line-height: 1; }
    .icon-button {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: #7283cf;
      background: transparent;
    }
    .icon-button:hover { background: #eef2ff; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }

    .board-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; container-type: size; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
      width: min(100%, 100cqh);
      max-width: 100%;
      height: auto;
      max-height: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #65738c;
      border-radius: 6px;
      background: #fff;
      container-type: inline-size;
      touch-action: manipulation;
    }
    .board.hidden { visibility: hidden; }
    .cell {
      display: grid;
      position: relative;
      min-width: 0;
      min-height: 0;
      place-items: center;
      padding: 0;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: #4569e8;
      background: #fff;
      font-size: clamp(20px, 8.5cqi, 76px);
      font-weight: 300;
      line-height: 1;
      transition: background-color .12s ease;
    }
    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+73) { border-bottom: 0; }
    .cell.box-right { border-right: 2px solid #65738c; }
    .cell.box-bottom { border-bottom: 2px solid #65738c; }
    .cell.given { color: #263247; }
    .cell.peer { background: #f2f5fc; }
    .cell.same { color: #18805d; background: #e9f8f1; }
    .cell.user-entry { color: #4569b8; }
    .cell.selected { z-index: 1; outline: 2px solid var(--blue); outline-offset: -2px; background: #dce5ff; }
    .cell.invalid, .cell.invalid.selected { color: #b4232e; background: #ffe1e2; box-shadow: inset 0 0 0 2px #d64c55; }
    .cell:focus-visible { z-index: 2; outline: 3px solid #7891f5; outline-offset: -3px; }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell.value-entry-pop { z-index: 2; animation: value-entry-pop .26s cubic-bezier(.2, .8, .2, 1); }
    @keyframes value-entry-pop {
      0% { transform: scale(.88); }
      45% { box-shadow: inset 0 0 0 2px #4569e866; transform: scale(1.07); }
      100% { box-shadow: none; transform: scale(1); }
    }
    .cell.note-warning { animation: note-warning-flash .7s ease-in-out 2; }
    @keyframes note-warning-flash {
      25%, 75% { color: #d64c55; background: #ffe1e2; box-shadow: inset 0 0 0 3px #dc3545, 0 0 16px rgba(220, 53, 69, .8); filter: brightness(1.2); }
    }
    .cell.completion-celebration {
      z-index: 1;
      animation: completion-celebration 1.35s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--completion-delay, 0ms);
    }
    @keyframes completion-celebration {
      0%, 100% { background-color: transparent; box-shadow: none; transform: scale(1); }
      18% { background-color: #ffe66d; box-shadow: inset 0 0 0 2px #ff9f1c, 0 0 18px rgba(255, 159, 28, .75); transform: scale(1.06); }
      42% { background-color: #be8bff; box-shadow: inset 0 0 0 2px #8a42e8, 0 0 18px rgba(138, 66, 232, .7); transform: scale(1.06); }
      70% { background-color: #68e1fd; box-shadow: inset 0 0 0 2px #16a8d5, 0 0 18px rgba(22, 168, 213, .65); transform: scale(1.03); }
    }
    .note-grid {
      position: absolute;
      inset: 2px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      color: #65738c;
      font-size: clamp(7px, 2.5cqi, 15px);
      font-weight: 550;
      line-height: 1;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 9px;
      color: #3455ce;
      background: #fff;
      border: 2px solid #65738c;
      font-weight: 800;
    }
    .overlay.show { display: flex; }
    .overlay button { padding: 10px 22px; border: 0; border-radius: 12px; color: #fff; background: var(--blue); font-weight: 750; }

    .difficulty-control { position: relative; min-width: 0; }
    .difficulty-control > .tool { width: 100%; height: 100%; --tool-color: #4569e8; --tool-border: #d7e0ff; --tool-active-bg: #4569e8; }
    .difficulty-control .tool-icon { color: #4569e8; }
    .difficulty-label { position: absolute; top: 6px; left: calc(50% + 4px); max-width: calc(50% - 6px); overflow: hidden; color: #dc3545; font-size: 7px; font-weight: 850; line-height: 1.2; text-overflow: ellipsis; }
    .difficulty-label[data-value="harder"], .difficulty-label[data-value="expert"] { top: 4px; right: 2px; left: auto; width: 30px; max-width: 52%; height: auto; overflow: visible; font-size: 7px; line-height: 1.05; text-align: center; text-overflow: clip; white-space: normal; }
    .difficulty-popover {
      position: absolute;
      z-index: 15;
      right: 0;
      bottom: calc(100% + 8px);
      display: none;
      width: min(170px, calc(100vw - 24px));
      gap: 5px;
      padding: 7px;
      border: 1px solid #dce3ef;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 10px 28px #2639582e;
    }
    .difficulty-popover.show { display: grid; }
    .difficulty-option { display: flex; min-height: 38px; align-items: center; gap: 9px; padding: 6px 9px; border: 0; border-radius: 10px; color: #536078; background: #f7f8fc; text-align: left; font-size: 12px; font-weight: 750; cursor: pointer; }
    .difficulty-option:hover { filter: brightness(.97); }
    .difficulty-option[aria-selected="true"] { color: #fff; }
    .difficulty-option[data-value="easy"][aria-selected="true"] { background: #23a879; }
    .difficulty-option[data-value="medium"][aria-selected="true"] { background: #ed9d26; }
    .difficulty-option[data-value="hard"][aria-selected="true"] { background: #e45d68; }
    .difficulty-option[data-value="harder"][aria-selected="true"] { background: #a64ec2; }
    .difficulty-option[data-value="expert"][aria-selected="true"] { background: #7041a6; }
    .difficulty-dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: #23a879; }
    .difficulty-option[data-value="medium"] .difficulty-dot { background: #ed9d26; }
    .difficulty-option[data-value="hard"] .difficulty-dot { background: #e45d68; }
    .difficulty-option[data-value="harder"] .difficulty-dot { background: #a64ec2; }
    .difficulty-option[data-value="expert"] .difficulty-dot { background: #7041a6; }
    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      z-index: 50;
      display: flex;
      width: min(430px, calc(100vw - 24px));
      align-items: center;
      gap: 13px;
      padding: 13px 16px;
      border: 1px solid #cbd6e8;
      border-radius: 17px;
      color: #536078;
      background: #fff;
      box-shadow: 0 12px 32px #26395833;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -150%);
      transition: transform .4s ease, opacity .4s ease;
    }
    .toast-icon-wrap { display: grid; width: 42px; height: 42px; flex: none; place-items: center; border-radius: 13px; color: #4569e8; background: #edf1ff; }
    .toast-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toast-content { display: grid; min-width: 0; gap: 3px; }
    .toast-title { color: #26344c; font-size: 14px; font-weight: 800; line-height: 1.25; }
    .toast-message { color: #65738c; font-size: 12px; font-weight: 550; line-height: 1.4; overflow-wrap: anywhere; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.success { border-color: #c7ebdc; }
    .toast.success .toast-icon-wrap { color: #18805d; background: #e9f8f1; }
    .toast.error { border-color: #f3caca; }
    .toast.error .toast-icon-wrap { color: #b3474e; background: #fff0f0; }

    .tool-row { min-width: 0; }
    .toolbar { display: grid; min-width: 0; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: stretch; gap: 5px; }
    .tool {
      --tool-color: #4569e8;
      --tool-bg: #fff;
      --tool-border: #e1e6ef;
      --tool-active-bg: #3455ce;
      position: relative;
      display: flex;
      min-width: 0;
      height: 46px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 3px 2px;
      border: 0;
      border-radius: 12px;
      color: var(--tool-color);
      background: transparent;
      box-shadow: none;
      font-size: 9px;
      font-weight: 750;
      white-space: nowrap;
      transition: color .15s ease, background-color .15s ease, border-color .15s ease, transform .12s ease;
    }
    #undo { --tool-color: #4569e8; --tool-border: #d7e0ff; --tool-active-bg: #3455ce; }
    #erase, #notes-toggle, #hint { --tool-color: #4569e8; --tool-border: #d7e0ff; --tool-active-bg: #3455ce; }
    .tool .tool-icon { width: 17px; height: 17px; flex: 0 0 auto; color: var(--tool-color); fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    .tool:hover { opacity: .7; }
    .tool:active, .tool.active { color: var(--tool-active-bg); background: transparent; }
    .tool:focus-visible { outline: 2px solid var(--tool-active-bg); outline-offset: 2px; }
    .tool:disabled { opacity: .45; cursor: default; }
    .tool.active { box-shadow: none; }
    #number-lock-toggle[aria-pressed="true"], #notes-toggle[aria-pressed="true"] { background: transparent; }
    .tool-caption { display: flex; min-width: 0; align-items: center; justify-content: center; gap: 3px; }
    #notes-toggle .tool-caption { flex-direction: column; gap: 1px; }
    .badge { display: inline-grid; min-width: 14px; height: 14px; place-items: center; padding: 0 3px; border-radius: 7px; color: #fff; background: var(--blue); font-size: 8px; font-weight: 800; line-height: 1; }
    #hint .badge { position: absolute; top: 6px; left: calc(50% + 4px); color: #dc3545; background: transparent; }
    .tool-state { padding: 1px 4px; border-radius: 4px; font-size: 7px; font-weight: 850; letter-spacing: .02em; line-height: 1.2; }
    .tool-state.off { color: #c62828; background: #ffebee; }
    .tool-state.on { color: #18805d; background: #e9f8f1; }
    #notes-toggle .tool-state { position: absolute; top: 6px; left: calc(50% + 4px); padding: 0; border-radius: 0; background: transparent; }
    #notes-toggle .tool-state.off { color: #dc3545; }
    #notes-toggle .tool-state.on { color: #18805d; }
    #number-lock-toggle .tool-state.on, #notes-toggle .tool-state.on { color: #087f6a; font-size: 8px; font-weight: 900; }
    #number-lock-toggle .tool-state { position: absolute; top: 6px; left: calc(50% + 4px); padding: 0; }
    #hint .badge, #notes-toggle .tool-state, .difficulty-label { height: 8.4px; line-height: 8.4px; }
    .number-pad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
    .score-float {
      position: absolute;
      z-index: 4;
      color: #087f6a;
      font-size: clamp(16px, 4.4vw, 22px);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 1px 4px #fff, 0 0 8px #fff;
      transform: translateX(-50%);
      animation: score-float-up 1.35s cubic-bezier(.22, .61, .36, 1) forwards;
    }
    #score-effects { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    @keyframes score-float-up {
      from { opacity: 0; transform: translate(-50%, 4px) scale(.88); }
      15% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -34px) scale(1); }
    }
    .number-button {
      display: flex;
      flex-direction: column;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0;
      gap: 1px;
      border: 1px solid #e5eaf4;
      border-radius: 10px;
      color: #4569e8;
      background: #fff;
      font-size: 30px;
      font-weight: 500;
      transition: transform .12s ease, background .12s ease;
    }
    .number-button .remaining-count { color: var(--muted); font-size: 9px; font-weight: 750; line-height: 1; }
    .number-button:hover { background: #eef2ff; }
    .number-button.digit-pop { animation: number-button-pop .28s cubic-bezier(.2, .8, .2, 1); }
    @keyframes number-button-pop {
      45% { transform: translateY(-4px) scale(1.08); }
      100% { transform: translateY(0) scale(1); }
    }
    .number-button.selected { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 3px 10px #4569e84d; }
    .number-button.selected .remaining-count { color: #fff; }
    .number-button.note-highlight { border-color: #8157d9; color: #fff; background: #8157d9; box-shadow: 0 3px 10px #8157d94d; }
    .number-button.note-highlight .remaining-count { color: #fff; }
    .number-pad.notes-mode .number-button:not(:disabled) { opacity: .55; }
    .number-pad.notes-mode .number-button.note-highlight:not(:disabled) { opacity: 1; }
    .number-button:active, .tool:active { transform: scale(.96); }
    .number-button:disabled { opacity: .3; cursor: default; }

    .modal { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: #1b263b66; }
    .modal.show { display: flex; }
    .modal-card { width: min(100%, 360px); padding: 20px; border-radius: 18px; background: #fff; box-shadow: 0 24px 60px #1b263b40; }
    .modal-card h2 { margin: 0 0 14px; font-size: 18px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; color: #707c91; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .field select { padding: 10px 12px; border: 1px solid #e1e6ef; border-radius: 10px; color: #2d3950; background: #fbfcfe; font-size: 14px; font-weight: 650; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-button { min-height: 42px; padding: 9px 10px; border: 1px solid #e1e6ef; border-radius: 10px; color: #536078; background: #fff; font-size: 13px; font-weight: 700; }
    .action-button:hover { background: #f6f8fc; }
    .action-button.primary { grid-column: 1 / -1; border-color: var(--blue); color: #fff; background: var(--blue); }
    .modal-card > p { margin: 0 0 16px; color: #65738c; font-size: 13px; line-height: 1.5; }
    .pause-summary { display: grid; gap: 10px; margin: 0 0 18px; }
    .pause-summary div { display: flex; justify-content: space-between; gap: 12px; color: #65738c; font-size: 13px; }
    .pause-summary strong { color: var(--stat-ink); font-variant-numeric: tabular-nums; }
    .pause-card .modal-actions { grid-template-columns: 1fr; }
    .pause-card .action-button.primary { grid-column: auto; }
    .game-over-card { text-align: center; }
    .game-over-card p { margin: 0 0 18px; color: #65738c; font-size: 14px; line-height: 1.5; }
    .game-over-card .modal-actions { grid-template-columns: 1fr; }
    .game-over-card .action-button.primary { grid-column: auto; }
    .victory-modal { background: #1b263b99; }
    .victory-card {
      overflow: hidden;
      border: 2px solid #ffd166;
      background: radial-gradient(circle at 50% 0, #fff5c2, #fff 48%);
      text-align: center;
      animation: victory-pop .4s cubic-bezier(.2, .8, .2, 1) both;
    }
    .victory-card h2 { color: #a45b00; font-size: 24px; }
    .victory-card p { margin: 0 0 18px; color: #65738c; font-size: 14px; line-height: 1.5; }
    .victory-card .modal-actions { grid-template-columns: 1fr 1fr; }
    .victory-card .action-button.primary { grid-column: 1 / -1; border-color: #e9a400; background: linear-gradient(135deg, #ffb703, #fb8500); }
    @keyframes victory-pop {
      from { opacity: 0; transform: translateY(12px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ad-banner-container {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      min-height: calc(50px + env(safe-area-inset-bottom));
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .ad-banner-link {
      display: flex;
      width: 100%;
      max-width: 728px;
      min-height: 50px;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      border-radius: 10px 10px 0 0;
      background: #fff3ec;
      color: #222;
      text-decoration: none;
      box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    }
    .ad-banner-link img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
    .ad-banner-text { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.25; }
    .ad-banner-text small { display: block; color: #ee4d2d; font-weight: 600; }
    .ad-banner-cta { padding: 6px 12px; border-radius: 6px; background: #ee4d2d; color: #fff; font-size: 12px; font-weight: 700; }

    @media (max-width: 380px) {
      .topbar { padding: 0 1px; }
      .topbar-button { width: 32px; height: 32px; }
      .info-bar { gap: 3px; padding: 0 2px; }
      .info-controls { gap: 2px; }
      .icon-button { width: 29px; height: 29px; }
      .timer-row { gap: 2px; }
      .timer-row #timer { font-size: 12px; }
      .toolbar { gap: 3px; }
      .tool { height: 44px; gap: 2px; padding: 2px 1px; font-size: 8px; }
      .tool .tool-icon { width: 16px; height: 16px; }
      .number-pad { gap: 2px; }
      .number-button { min-height: 48px; font-size: 23px; }
    }
    @media (min-width: 600px) {
      .topbar { padding: 0 4px; }
      .icon-button { width: 32px; height: 32px; }
      .toolbar { gap: 7px; }
      .tool { height: 54px; gap: 4px; font-size: 10px; }
      .tool .tool-icon { width: 19px; height: 19px; }
      .number-pad { gap: 6px; }
      .number-button { min-height: 58px; font-size: clamp(27px, 3.4vw, 36px); }
    }
    @media (min-width: 768px) {
      body {
        display: grid;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px 16px calc(74px + env(safe-area-inset-bottom));
        overflow-x: hidden;
        overflow-y: auto;
      }
      .app {
        width: min(100%, 520px);
        height: min(900px, calc(100dvh - 122px - env(safe-area-inset-bottom)));
        min-height: 620px;
        gap: 10px;
        padding: 12px;
        border: 1px solid #e5eaf2;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 24px 70px #2639581c;
      }
    }
    @media (max-height: 620px) {
      .app { gap: 4px; }
      .topbar { padding: 4px; }
      .toolbar { gap: 3px; }
      .tool { height: 40px; }
      .number-button { min-height: 42px; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .score-float { animation-duration: .01ms; }
      .cell.completion-celebration { animation-duration: .01ms; animation-delay: 0ms; }
      .cell.value-entry-pop { animation-duration: .01ms; }
    }
  </style>
</head>

  <script>
    (() => {
      "use strict";

      const MAX_ERRORS = 3;
      const MAX_HINTS = 3;
      const boardElement = document.getElementById("board");
      const scoreEffectsElement = document.getElementById("score-effects");
      const timerElement = document.getElementById("timer");
      const toastElement = document.getElementById("toast");
      const toastTitleElement = document.getElementById("toast-title");
      const toastMessageElement = document.getElementById("toast-message");
      const difficultyState = { value: "medium" };
      const difficultyControl = document.getElementById("difficulty-control");
      const difficultyToggle = document.getElementById("difficulty-toggle");
      const difficultyLabel = document.getElementById("difficulty-label");
      const difficultyElement = document.getElementById("difficulty-popover");
      const difficultyOptions = difficultyElement.querySelectorAll(".difficulty-option");
      const scoreElement = document.getElementById("score");
      const errorsElement = document.getElementById("errors");
      const hintCountElement = document.getElementById("hint-count");
      const notesToggle = document.getElementById("notes-toggle");
      const numberLockToggle = document.getElementById("number-lock-toggle");
      const numberLockState = document.getElementById("number-lock-state");
      const notesState = document.getElementById("notes-state");
      const pauseOverlay = document.getElementById("pause-overlay");
      const settingsModal = document.getElementById("settings-modal");
      const pauseModal = document.getElementById("pause-modal");
      const changeGameModal = document.getElementById("change-game-modal");
      const gameOverModal = document.getElementById("game-over-modal");
      const victoryModal = document.getElementById("victory-modal");
      const clueTargets = { easy: 42, medium: 37, hard: 32, harder: 27, expert: 22 };
      const correctEntryPoints = { easy: 50, medium: 100, hard: 150, harder: 200, expert: 250 };

      let solution = [];
      let puzzle = [];
      let values = [];
      let notes = [];
      let history = [];
      let undoUsed = false;
      let eraseUsed = false;
      let selectedCell = -1;
      let selectedDigit = 0;
      let activePadDigit = 0;
      let invalidCells = new Set();
      let elapsedMs = 0;
      let resumedAt = Date.now();
      let paused = false;
      let finished = false;
      let notesMode = false;
      let numberLock = false;
      let score = 0;
      let errors = 0;
      let hintsLeft = MAX_HINTS;
      let toastTimeout;
      const toolFeedbackTimeouts = new WeakMap();

      function shuffled(items) {
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function randomizedSolution() {
        const groups = shuffled([0, 1, 2]);
        const rows = groups.flatMap((group) => shuffled([0, 1, 2]).map((row) => group * 3 + row));
        const columns = shuffled([0, 1, 2]).flatMap((group) => shuffled([0, 1, 2]).map((column) => group * 3 + column));
        const digits = shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9]);
        return rows.map((row) => columns.map((column) => digits[(row * 3 + Math.floor(row / 3) + column) % 9]));
      }

      function countSolutions(grid, limit = 2) {
        let bestRow = -1;
        let bestColumn = -1;
        let bestCandidates = null;

        for (let row = 0; row < 9; row += 1) {
          for (let column = 0; column < 9; column += 1) {
            if (grid[row][column] !== 0) continue;
            const used = new Set();
            for (let i = 0; i < 9; i += 1) {
              used.add(grid[row][i]);
              used.add(grid[i][column]);
              used.add(grid[Math.floor(row / 3) * 3 + Math.floor(i / 3)][Math.floor(column / 3) * 3 + i % 3]);
            }
            const candidates = [];
            for (let value = 1; value <= 9; value += 1) {
              if (!used.has(value)) candidates.push(value);
            }
            if (candidates.length === 0) return 0;
            if (bestCandidates === null || candidates.length < bestCandidates.length) {
              bestRow = row;
              bestColumn = column;
              bestCandidates = candidates;
              if (candidates.length === 1) break;
            }
          }
          if (bestCandidates?.length === 1) break;
        }

        if (bestCandidates === null) return 1;
        let total = 0;
        for (const value of bestCandidates) {
          grid[bestRow][bestColumn] = value;
          total += countSolutions(grid, limit - total);
          grid[bestRow][bestColumn] = 0;
          if (total >= limit) return total;
        }
        return total;
      }

      function createPuzzle(difficulty) {
        const answer = randomizedSolution();
        const grid = answer.map((row) => row.slice());
        let clues = 81;
        const cells = shuffled(Array.from({ length: 81 }, (_, index) => index));
        const target = clueTargets[difficulty];

        for (const index of cells) {
          if (clues <= target) break;
          const row = Math.floor(index / 9);
          const column = index % 9;
          const previous = grid[row][column];
          grid[row][column] = 0;
          if (countSolutions(grid) === 1) {
            clues -= 1;
          } else {
            grid[row][column] = previous;
          }
        }
        return { answer, grid };
      }

      function setMessage(text, kind = "") {
        if (kind !== "error" && kind !== "hint") return;
        window.clearTimeout(toastTimeout);
        toastTitleElement.textContent = kind === "error" ? "Có lỗi xảy ra" : "Gợi ý quan trọng";
        toastMessageElement.textContent = text;
        toastElement.className = kind === "error" ? "toast show error" : "toast show success";
        toastTimeout = window.setTimeout(() => toastElement.classList.remove("show"), 3200);
      }

      function showCompletionEffects(previousValues) {
        const units = [];
        for (let row = 0; row < 9; row += 1) {
          units.push(Array.from({ length: 9 }, (_, column) => row * 9 + column));
        }
        for (let column = 0; column < 9; column += 1) {
          units.push(Array.from({ length: 9 }, (_, row) => row * 9 + column));
        }
        for (let boxRow = 0; boxRow < 3; boxRow += 1) {
          for (let boxColumn = 0; boxColumn < 3; boxColumn += 1) {
            units.push(Array.from({ length: 9 }, (_, index) =>
              (boxRow * 3 + Math.floor(index / 3)) * 9 + boxColumn * 3 + index % 3));
          }
        }

        const isComplete = (indexes, grid) => {
          const digits = new Set(indexes.map((index) => grid[index]));
          return digits.size === 9 && !digits.has(0);
        };
        const delays = new Map();
        for (const indexes of units) {
          if (isComplete(indexes, previousValues) || !isComplete(indexes, values)) continue;
          for (const index of indexes) {
            const delay = (Math.floor(index / 9) - Math.floor(indexes[0] / 9)) * 55;
            if (!delays.has(index) || delay < delays.get(index)) delays.set(index, delay);
          }
        }

        for (const [index, delay] of delays) {
          const cell = boardElement.querySelector(`[data-index="${index}"]`);
          if (!cell) continue;
          cell.style.setProperty("--completion-delay", `${delay}ms`);
          cell.classList.add("completion-celebration");
          cell.addEventListener("animationend", () => {
            cell.classList.remove("completion-celebration");
            cell.style.removeProperty("--completion-delay");
          }, { once: true });
        }
      }

      function renderBoard() {
        const selectedValue = selectedCell >= 0 ? values[selectedCell] : 0;
        const fragment = document.createDocumentFragment();

        values.forEach((value, index) => {
          const row = Math.floor(index / 9);
          const column = index % 9;
          const given = puzzle[row][column] !== 0;
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(index);
          cell.setAttribute("role", "gridcell");
          const cellNotes = notes[index];
          const notesLabel = cellNotes.size ? `, ghi chú ${Array.from(cellNotes).sort().join(", ")}` : "";
          cell.setAttribute("aria-label", `Hàng ${row + 1}, cột ${column + 1}${value ? `, số ${value}` : ", ô trống"}${notesLabel}${given ? ", số cho sẵn" : ""}${invalidCells.has(index) ? ", số vừa nhập không hợp lệ" : ""}`);
          if (given) {
            cell.classList.add("given");
            cell.disabled = true;
          }
          if (column === 2 || column === 5) cell.classList.add("box-right");
          if (row === 2 || row === 5) cell.classList.add("box-bottom");
          if (selectedCell >= 0 && (Math.floor(selectedCell / 9) === row || selectedCell % 9 === column ||
              (Math.floor(Math.floor(selectedCell / 9) / 3) === Math.floor(row / 3) && Math.floor((selectedCell % 9) / 3) === Math.floor(column / 3)))) {
            cell.classList.add("peer");
          }
          if (selectedCell === index) cell.classList.add("selected");
          if (value && value === selectedValue) cell.classList.add("same");
          if (!given && value) cell.classList.add("user-entry");
          if (invalidCells.has(index)) cell.classList.add("invalid");
          if (value) {
            cell.textContent = String(value);
          } else if (cellNotes.size) {
            const noteGrid = document.createElement("span");
            noteGrid.className = "note-grid";
            for (let note = 1; note <= 9; note += 1) {
              const noteElement = document.createElement("span");
              noteElement.textContent = cellNotes.has(note) ? String(note) : "";
              noteGrid.appendChild(noteElement);
            }
            cell.appendChild(noteGrid);
          }
          fragment.appendChild(cell);
        });

        boardElement.replaceChildren(fragment);
        const digitCounts = Array(10).fill(0);
        values.forEach((value) => { if (value) digitCounts[value] += 1; });
        if (selectedDigit && digitCounts[selectedDigit] >= 9) selectedDigit = 0;
        document.querySelectorAll(".number-button").forEach((button) => {
          const digit = Number(button.dataset.value);
          const remaining = Math.max(0, 9 - digitCounts[digit]);
          const exhausted = remaining === 0;
          button.disabled = exhausted;
          button.classList.toggle("selected", digit === activePadDigit && !exhausted);
          button.classList.toggle("note-highlight", selectedCell >= 0 && notes[selectedCell].has(digit));
          const noteConflict = notesMode && selectedCell >= 0 && !values[selectedCell] &&
            !notes[selectedCell].has(digit) && violatesRules(selectedCell, digit);
          button.querySelector(".remaining-count").textContent = String(remaining);
          button.setAttribute("aria-label", `Điền số ${digit}, còn ${remaining} ô${exhausted ? ", đã đủ 9 số, không thể chọn" : noteConflict ? ", đã có trong hàng, cột hoặc khối 3x3 của ô đang chọn, không thể ghi chú" : ""}`);
        });
      }

      function currentElapsed() {
        return elapsedMs + (paused || finished ? 0 : Date.now() - resumedAt);
      }

      function updateStats() {
        const seconds = Math.floor(currentElapsed() / 1000);
        timerElement.textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        scoreElement.textContent = String(score);
        errorsElement.textContent = `${errors}/${MAX_ERRORS}`;
        errorsElement.classList.toggle("bad", errors > 0);
        document.getElementById("pause-time").textContent = timerElement.textContent;
        document.getElementById("pause-errors").textContent = errorsElement.textContent;
        document.getElementById("pause-difficulty").textContent = difficultyLabel.textContent;
        hintCountElement.textContent = String(hintsLeft);
        document.getElementById("hint").disabled = hintsLeft === 0;
        document.getElementById("undo").disabled = undoUsed || history.length === 0;
        document.getElementById("erase").disabled = eraseUsed;
      }

      function isComplete() {
        return values.every((value, index) => value === solution[Math.floor(index / 9)][index % 9]);
      }

      function violatesRules(index, value) {
        const row = Math.floor(index / 9);
        const column = index % 9;
        for (let i = 0; i < 9; i += 1) {
          const boxIndex = (Math.floor(row / 3) * 3 + Math.floor(i / 3)) * 9 +
            Math.floor(column / 3) * 3 + i % 3;
          if ((i !== column && values[row * 9 + i] === value) ||
              (i !== row && values[i * 9 + column] === value) ||
              (boxIndex !== index && values[boxIndex] === value)) {
            return true;
          }
        }
        return false;
      }

      function conflictLocation(index, value) {
        const row = Math.floor(index / 9);
        const column = index % 9;
        for (let i = 0; i < 9; i += 1) {
          if (i !== column && values[row * 9 + i] === value) return "hàng";
          if (i !== row && values[i * 9 + column] === value) return "cột";
        }
        return "khối 3x3";
      }

      function flashConflictingCells(index, value) {
        const row = Math.floor(index / 9);
        const column = index % 9;
        values.forEach((cellValue, peerIndex) => {
          if (cellValue !== value || peerIndex === index) return;
          const peerRow = Math.floor(peerIndex / 9);
          const peerColumn = peerIndex % 9;
          const sameBox = Math.floor(row / 3) === Math.floor(peerRow / 3) &&
            Math.floor(column / 3) === Math.floor(peerColumn / 3);
          if (peerRow !== row && peerColumn !== column && !sameBox) return;
          const cell = boardElement.querySelector(`[data-index="${peerIndex}"]`);
          if (!cell) return;
          cell.classList.add("note-warning");
          cell.addEventListener("animationend", () => cell.classList.remove("note-warning"), { once: true });
        });
      }

      function removePeerNotes(index, value) {
        const row = Math.floor(index / 9);
        const column = index % 9;
        notes.forEach((cellNotes, peerIndex) => {
          if (peerIndex === index) return;
          const peerRow = Math.floor(peerIndex / 9);
          const peerColumn = peerIndex % 9;
          const sameBox = Math.floor(row / 3) === Math.floor(peerRow / 3) &&
            Math.floor(column / 3) === Math.floor(peerColumn / 3);
          if (peerRow === row || peerColumn === column || sameBox) {
            cellNotes.delete(value);
          }
        });
      }

      function pushHistory() {
        history.push({ values: values.slice(), notes: notes.map((set) => new Set(set)), invalidCells: new Set(invalidCells), score });
        if (history.length > 200) history.shift();
      }

      function showScoreEffect(index, points) {
        const cell = boardElement.querySelector(`[data-index="${index}"]`);
        if (!cell) return;
        const cellRect = cell.getBoundingClientRect();
        const effectsRect = scoreEffectsElement.getBoundingClientRect();
        const effect = document.createElement("span");
        effect.className = "score-float";
        effect.textContent = `+${points}`;
        effect.style.left = `${cellRect.left - effectsRect.left + cellRect.width / 2}px`;
        effect.style.top = `${cellRect.top - effectsRect.top + cellRect.height / 2}px`;
        effect.addEventListener("animationend", () => effect.remove(), { once: true });
        scoreEffectsElement.appendChild(effect);
      }

      function updateCorrectEntryScore(index, value, previousValue) {
        const expectedValue = solution[Math.floor(index / 9)][index % 9];
        const wasCorrect = previousValue === expectedValue;
        const isCorrect = value === expectedValue;
        const points = correctEntryPoints[difficultyState.value] || correctEntryPoints.medium;
        if (wasCorrect !== isCorrect) {
          if (isCorrect) {
            score += points;
            showScoreEffect(index, points);
          } else {
            score = Math.max(0, score - points);
          }
        }
        scoreElement.textContent = String(score);
      }

      function finishIfComplete() {
        if (isComplete()) {
          elapsedMs = currentElapsed();
          finished = true;
          setMessage("Tuyệt vời! Bạn đã hoàn thành Sudoku.");
          updateStats();
          victoryModal.classList.add("show");
          document.getElementById("victory-new").focus();
        }
      }

      function showValueEntryEffect() {
        const cell = boardElement.querySelector(`[data-index="${selectedCell}"]`);
        if (!cell) return;
        cell.classList.add("value-entry-pop");
        cell.addEventListener("animationend", () => cell.classList.remove("value-entry-pop"), { once: true });
      }

      function enterValue(value) {
        if (finished || paused) return;
        if (value && values.filter((entry) => entry === value).length >= 9) return;
        if (value || !numberLock) selectedDigit = value || 0;
        if (selectedCell < 0) {
          setMessage("Hãy chọn một ô trống trước nhé.");
          renderBoard();
          return;
        }
        const row = Math.floor(selectedCell / 9);
        const column = selectedCell % 9;
        if (puzzle[row][column] !== 0) return;
        const previousValue = values[selectedCell];

        if (notesMode && value) {
          if (values[selectedCell]) {
            setMessage("Xóa số chính thức trong ô trước khi thêm ghi chú.");
            return;
          }
          if (!notes[selectedCell].has(value) && violatesRules(selectedCell, value)) {
            setMessage("Số này đã có trong hàng, cột hoặc khối 3x3 nên không thể ghi chú.", "error");
            renderBoard();
            flashConflictingCells(selectedCell, value);
            return;
          }
          pushHistory();
          if (notes[selectedCell].has(value)) {
            notes[selectedCell].delete(value);
          } else {
            notes[selectedCell].add(value);
          }
          setMessage("Đã cập nhật ghi chú cho ô.");
          activePadDigit = 0;
          updateStats();
          renderBoard();
          return;
        }

        if (value && violatesRules(selectedCell, value)) {
          pushHistory();
          values[selectedCell] = value;
          notes[selectedCell].clear();
          invalidCells.add(selectedCell);
          errors += 1;
          score = Math.max(0, score - 50);
          updateCorrectEntryScore(selectedCell, value, previousValue);
          if (errors >= MAX_ERRORS) {
            elapsedMs = currentElapsed();
            finished = true;
            gameOverModal.classList.add("show");
            document.getElementById("game-over-restart").focus();
            setMessage("Bạn đã thua trò chơi vì bạn mắc 3 lỗi.", "error");
          } else if (errors === 1) {
            setMessage(`Trùng ở ${conflictLocation(selectedCell, value)}!`, "error");
          } else if (errors === 2) {
            setMessage("Bạn đã mắc lỗi lần thứ hai. Hãy thử dùng Gợi ý để được trợ giúp nhé!", "error");
          } else {
            setMessage(`Trùng ở ${conflictLocation(selectedCell, value)}!`, "error");
          }
          updateStats();
          activePadDigit = 0;
          renderBoard();
          showValueEntryEffect();
          flashConflictingCells(selectedCell, value);
          return;
        }

        if (!value && !values[selectedCell] && notes[selectedCell].size === 0) return;
        if (!value && eraseUsed) {
          setMessage("Bạn đã dùng hết lượt xóa trong bàn chơi này.", "error");
          return;
        }
        pushHistory();
        if (!value) eraseUsed = true;
        if (!value) invalidCells.delete(selectedCell);
        const previousValues = values.slice();
        values[selectedCell] = value;
        notes[selectedCell].clear();
        updateCorrectEntryScore(selectedCell, value, previousValue);
        if (value) {
          removePeerNotes(selectedCell, value);
          setMessage(value === solution[row][column] ? "Chính xác! Tiếp tục thôi." : "Đã điền số. Hãy kiểm tra lời giải.");
        } else {
          setMessage("Đã xóa số trong ô.");
        }
        updateStats();
        activePadDigit = 0;
        renderBoard();
        if (value) {
          showValueEntryEffect();
          showCompletionEffects(previousValues);
        }
        finishIfComplete();
      }

      function undo() {
        if (finished || paused || undoUsed || history.length === 0) return;
        const last = history.pop();
        undoUsed = true;
        values = last.values;
        notes = last.notes;
        invalidCells = last.invalidCells;
        score = last.score;
        setMessage("Đã hoàn tác.");
        updateStats();
        renderBoard();
      }

      function giveHint() {
        if (finished || paused) return;
        if (hintsLeft === 0) {
          setMessage("Bạn đã dùng hết lượt gợi ý.", "error");
          return;
        }
        let target = selectedCell;
        const solvable = (index) => puzzle[Math.floor(index / 9)][index % 9] === 0 &&
          values[index] !== solution[Math.floor(index / 9)][index % 9];
        if (target < 0 || !solvable(target)) {
          const candidates = values.map((_, index) => index).filter(solvable);
          if (candidates.length === 0) return;
          target = candidates[Math.floor(Math.random() * candidates.length)];
        }
        pushHistory();
        const previousValues = values.slice();
        values[target] = solution[Math.floor(target / 9)][target % 9];
        notes[target].clear();
        removePeerNotes(target, values[target]);
        selectedCell = target;
        hintsLeft -= 1;
        score = Math.max(0, score - 20);
        setMessage("Đã điền một ô gợi ý cho bạn.", "hint");
        updateStats();
        renderBoard();
        showCompletionEffects(previousValues);
        finishIfComplete();
      }

      function setNotesMode(on) {
        notesMode = on;
        document.getElementById("number-pad").classList.toggle("notes-mode", on);
        notesToggle.classList.toggle("active", on);
        notesToggle.setAttribute("aria-pressed", String(on));
        notesToggle.setAttribute("aria-label", `${on ? "Tắt" : "Bật"} chế độ ghi chú`);
        notesState.textContent = on ? "ON" : "OFF";
        notesState.classList.toggle("off", !on);
        notesState.classList.toggle("on", on);
      }

      function setNumberLock(on) {
        numberLock = on;
        numberLockToggle.setAttribute("aria-pressed", String(on));
        numberLockState.textContent = on ? "ON" : "OFF";
        numberLockState.classList.toggle("off", !on);
        numberLockState.classList.toggle("on", on);
        numberLockToggle.setAttribute("aria-label", `${on ? "Tắt" : "Bật"} Giữ số`);
      }

      function showToolFeedback(button) {
        window.clearTimeout(toolFeedbackTimeouts.get(button));
        button.classList.add("active");
        toolFeedbackTimeouts.set(button, window.setTimeout(() => {
          button.classList.remove("active");
          toolFeedbackTimeouts.delete(button);
        }, 250));
      }

      function setPaused(on) {
        if (finished || on === paused) return;
        if (on) {
          elapsedMs = currentElapsed();
        } else {
          resumedAt = Date.now();
        }
        paused = on;
        pauseOverlay.classList.toggle("show", on);
        boardElement.classList.toggle("hidden", on);
        pauseModal.classList.toggle("show", on);
        updateStats();
      }

      function resetState() {
        gameOverModal.classList.remove("show");
        victoryModal.classList.remove("show");
        changeGameModal.classList.remove("show");
        values = puzzle.flat();
        notes = Array.from({ length: 81 }, () => new Set());
        history = [];
        undoUsed = false;
        eraseUsed = false;
        selectedCell = -1;
        invalidCells = new Set();
        elapsedMs = 0;
        resumedAt = Date.now();
        finished = false;
        score = 0;
        errors = 0;
        hintsLeft = MAX_HINTS;
        setNotesMode(false);
        paused = true;
        setPaused(false);
        updateStats();
        renderBoard();
      }

      function startNewGame() {
        const generated = createPuzzle(difficultyState.value);
        solution = generated.answer;
        puzzle = generated.grid;
        resetState();
        setMessage("Chọn một ô trống rồi nhập số bạn muốn.");
      }

      function restartGame() {
        resetState();
        setMessage("Ván chơi đã được đặt lại. Chúc bạn may mắn!");
      }

      boardElement.addEventListener("click", (event) => {
        const cell = event.target.closest(".cell");
        if (!cell || cell.disabled || paused) return;
        selectedCell = Number(cell.dataset.index);
        activePadDigit = 0;
        if (numberLock && selectedDigit) {
          setMessage("Ô đã chọn. Đang điền số đã giữ.");
          enterValue(selectedDigit);
          return;
        }
        if (!numberLock) selectedDigit = values[selectedCell] || 0;
        setMessage("Ô đã chọn. Nhập số từ 1 đến 9.");
        renderBoard();
      });

      document.getElementById("number-pad").addEventListener("click", (event) => {
        const button = event.target.closest("[data-value]");
        if (button) {
          button.classList.remove("digit-pop");
          void button.offsetWidth;
          button.classList.add("digit-pop");
          button.addEventListener("animationend", () => button.classList.remove("digit-pop"), { once: true });
          activePadDigit = Number(button.dataset.value);
          enterValue(activePadDigit);
        }
      });
      numberLockToggle.addEventListener("click", () => setNumberLock(!numberLock));

      document.getElementById("erase").addEventListener("click", (event) => {
        showToolFeedback(event.currentTarget);
        enterValue(0);
      });
      document.getElementById("undo").addEventListener("click", (event) => {
        showToolFeedback(event.currentTarget);
        undo();
      });
      document.getElementById("hint").addEventListener("click", (event) => {
        showToolFeedback(event.currentTarget);
        giveHint();
      });
      notesToggle.addEventListener("click", () => {
        if (finished || paused) return;
        setNotesMode(!notesMode);
        setMessage(notesMode ? "Chế độ ghi chú đang bật. Chọn ô trống rồi nhập số cần ghi chú." : "Chế độ ghi chú đã tắt.");
      });
      document.getElementById("go-back").addEventListener("click", () => window.history.back());
      document.getElementById("change-game").addEventListener("click", () => changeGameModal.classList.add("show"));
      document.getElementById("cancel-change-game").addEventListener("click", () => changeGameModal.classList.remove("show"));
      document.getElementById("confirm-change-game").addEventListener("click", () => {
        changeGameModal.classList.remove("show");
        startNewGame();
      });
      changeGameModal.addEventListener("click", (event) => {
        if (event.target === changeGameModal) changeGameModal.classList.remove("show");
      });
      document.getElementById("pause-game").addEventListener("click", () => setPaused(true));
      document.getElementById("resume-game").addEventListener("click", () => setPaused(false));
      document.getElementById("resume").addEventListener("click", () => setPaused(false));

      function openSettings() { settingsModal.classList.add("show"); }
      function closeSettings() { settingsModal.classList.remove("show"); }
      document.getElementById("settings").addEventListener("click", openSettings);
      document.getElementById("close-settings").addEventListener("click", closeSettings);
      settingsModal.addEventListener("click", (event) => { if (event.target === settingsModal) closeSettings(); });

      document.getElementById("restart").addEventListener("click", () => { closeSettings(); restartGame(); });
      document.getElementById("new-game").addEventListener("click", () => { closeSettings(); startNewGame(); });
      document.getElementById("game-over-restart").addEventListener("click", restartGame);
      document.getElementById("game-over-new").addEventListener("click", startNewGame);
      document.getElementById("victory-restart").addEventListener("click", restartGame);
      document.getElementById("victory-new").addEventListener("click", startNewGame);
      function closeDifficultyPopover() {
        difficultyElement.classList.remove("show");
        difficultyToggle.setAttribute("aria-expanded", "false");
        difficultyElement.setAttribute("aria-hidden", "true");
      }
      difficultyToggle.addEventListener("click", () => {
        const isOpen = !difficultyElement.classList.contains("show");
        difficultyElement.classList.toggle("show", isOpen);
        difficultyToggle.setAttribute("aria-expanded", String(isOpen));
        difficultyElement.setAttribute("aria-hidden", String(!isOpen));
      });
      difficultyOptions.forEach((option) => option.addEventListener("click", () => {
        closeDifficultyPopover();
        if (option.dataset.value === difficultyState.value) return;
        difficultyState.value = option.dataset.value;
        difficultyLabel.textContent = option.textContent.trim();
        difficultyLabel.dataset.value = option.dataset.value;
        difficultyToggle.setAttribute("aria-label", `Độ khó: ${difficultyLabel.textContent}`);
        difficultyOptions.forEach((item) => item.setAttribute("aria-selected", String(item === option)));
        startNewGame();
      }));
      document.getElementById("check-board").addEventListener("click", () => {
        closeSettings();
        if (isComplete()) {
          finishIfComplete();
        } else {
          setMessage("Bảng vẫn còn ô trống hoặc số chưa chính xác.", "error");
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.matches("select, input, textarea, [contenteditable='true']")) return;
        if (event.key === "Escape" && changeGameModal.classList.contains("show")) { changeGameModal.classList.remove("show"); return; }
        if (event.key === "Escape" && difficultyElement.classList.contains("show")) { closeDifficultyPopover(); return; }
        if (event.key === "Escape" && settingsModal.classList.contains("show")) { closeSettings(); return; }
        if (paused) return;
        if (/^[1-9]$/.test(event.key)) {
          event.preventDefault();
          enterValue(Number(event.key));
          return;
        }
        if (event.key.toLowerCase() === "z" && !event.altKey && !event.shiftKey) {
          event.preventDefault();
          undo();
          return;
        }
        if (event.key === "Backspace" || event.key === "Delete" || event.key === "0") {
          event.preventDefault();
          enterValue(0);
          return;
        }
        if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key) || selectedCell < 0) return;
        event.preventDefault();
        const row = Math.floor(selectedCell / 9);
        const column = selectedCell % 9;
        const delta = {
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0],
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1]
        }[event.key];
        let nextRow = row;
        let nextColumn = column;
        for (let attempt = 0; attempt < 81; attempt += 1) {
          nextRow = (nextRow + delta[0] + 9) % 9;
          nextColumn = (nextColumn + delta[1] + 9) % 9;
          const index = nextRow * 9 + nextColumn;
          if (puzzle[nextRow][nextColumn] === 0) {
            selectedCell = index;
            activePadDigit = 0;
            if (!numberLock) selectedDigit = values[index] || 0;
            renderBoard();
            break;
          }
        }
      });
      document.addEventListener("click", (event) => {
        if (!difficultyControl.contains(event.target)) closeDifficultyPopover();
      });

      window.setInterval(updateStats, 1000);
      startNewGame();
    })();
  </script>
</body>
</html>
