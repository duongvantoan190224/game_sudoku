<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Sudoku — Thử thách trí tuệ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202b40;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #4569e8;
      --blue-dark: #3455ce;
      --line: #dce3ef;
      --muted: #7c879b;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 14px 2px calc(64px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 15% 0%, #e5ecff 0, transparent 38%), #f4f7fb;
    }
    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    .app { width: min(100%, 720px); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

    .topbar {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border: 1px solid #e5eaf2;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 20px #26395812;
    }
    .stat { min-width: 0; text-align: left; }
    .stat-label { display: block; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { display: block; overflow: hidden; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .stat-value.bad { color: #d64c55; }
    .icon-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      color: #536078;
      background: #f8faff;
      font-size: 18px;
    }
    .icon-button:hover { background: #eef2ff; }
    .topbar #menu-control { grid-row: 1; grid-column: 4; }
    .topbar #settings { grid-row: 1; grid-column: 5; }
    .menu-control { position: relative; }
    .menu-button {
      min-width: 52px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #e1e6ef;
      border-radius: 10px;
      color: #536078;
      background: #f8faff;
      font-size: 12px;
      font-weight: 750;
    }
    .menu-button:hover, .menu-button[aria-expanded="true"] { background: #eef2ff; }
    .menu-dropdown {
      position: absolute;
      z-index: 15;
      top: calc(100% + 8px);
      left: 0;
      display: grid;
      width: 176px;
      gap: 3px;
      padding: 5px;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 24px #26395826;
    }
    .menu-dropdown[hidden] { display: none; }
    .menu-dropdown button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 9px;
      border: 0;
      border-radius: 8px;
      color: var(--c, #536078);
      background: transparent;
      font-size: 12px;
      font-weight: 650;
      text-align: left;
      white-space: nowrap;
    }
    .menu-dropdown button:hover { background: color-mix(in srgb, var(--c) 12%, #fff); }
    .menu-dropdown button .mi {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      color: #fff;
      background: var(--c);
      font-size: 12px;
      line-height: 1;
    }
    #menu-pause { --c: #f59e0b; }
    #menu-resume { --c: #10b981; }
    #menu-restart { --c: #3b6df0; }
    #menu-new { --c: #8b5cf6; }
    .timer-row {
      grid-column: 3;
      grid-row: 1;
      display: flex;
      min-width: 0;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid #dfe6fa;
      border-radius: 14px;
      color: #3455ce;
      background: linear-gradient(135deg, #f2f5ff, #e9efff);
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .timer-row #timer {
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 950;
      letter-spacing: .035em;
      line-height: 1;
    }

    .board-wrap { position: relative; width: 100%; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #65738c;
      border-radius: 6px;
      background: #fff;
      touch-action: manipulation;
    }
    .board.hidden { visibility: hidden; }
    .cell {
      display: grid;
      position: relative;
      min-width: 0;
      min-height: 0;
      place-items: center;
      padding: 0;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: #4569e8;
      background: #fff;
      font-size: clamp(30px, min(9.4vw, 7vh), 66px);
      font-weight: 800;
      line-height: 1;
      transition: background-color .12s ease;
    }
    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+73) { border-bottom: 0; }
    .cell.box-right { border-right: 2px solid #65738c; }
    .cell.box-bottom { border-bottom: 2px solid #65738c; }
    .cell.given { color: #263247; font-weight: 800; }
    .cell.peer { background: #f2f5fc; }
    .cell.same { color: #3455ce; background: #e7edff; }
    .cell.user-entry { color: #087f6a; font-weight: 800; }
    .cell.selected { z-index: 1; outline: 2px solid var(--blue); outline-offset: -2px; background: #dce5ff; }
    .cell.conflict { color: #d64c55; }
    .cell.invalid, .cell.invalid.selected { color: #b4232e; background: #ffe1e2; box-shadow: inset 0 0 0 2px #d64c55; }
    .cell:focus-visible { z-index: 2; outline: 3px solid #7891f5; outline-offset: -3px; }
    .cell:disabled { cursor: default; opacity: 1; }
    .note-grid {
      position: absolute;
      inset: 2px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      color: #65738c;
      font-size: clamp(8px, 2.8vw, 15px);
      font-weight: 550;
      line-height: 1;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 9px;
      color: #3455ce;
      background: #fff;
      border: 2px solid #65738c;
      font-weight: 800;
    }
    .overlay.show { display: flex; }
    .overlay button { padding: 10px 22px; border: 0; border-radius: 12px; color: #fff; background: var(--blue); font-weight: 750; }

    .toast {
      display: flex;
      min-width: 0;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border: 1.5px solid #cbd6e8;
      border-radius: 14px;
      color: #536078;
      background: #f8faff;
      box-shadow: 0 4px 14px #26395812;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      overflow-wrap: anywhere;
      transition: opacity .18s ease;
    }
    .toast.show { opacity: 1; }
    .toast.success { color: #18805d; border-color: #c7ebdc; background: #e9f8f1; }
    .toast.error { color: #b3474e; border-color: #f3caca; background: #fff0f0; }

    .tool-row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); align-items: stretch; gap: 6px; }
    .toolbar { display: grid; min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .tool {
      --tool-color: #4569e8;
      --tool-bg: #eef2ff;
      --tool-border: #d7e0ff;
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 52px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px;
      border: 1px solid var(--tool-border);
      border-radius: 14px;
      color: var(--tool-color);
      background: var(--tool-bg);
      box-shadow: 0 3px 10px #2639580d;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
      transition: color .15s ease, background-color .15s ease, border-color .15s ease, transform .12s ease;
    }
    #undo { --tool-color: #4569e8; --tool-bg: #eef2ff; --tool-border: #d7e0ff; }
    #erase { --tool-color: #dc5964; --tool-bg: #fff0f1; --tool-border: #f5d3d6; }
    #notes-toggle { --tool-color: #8157d9; --tool-bg: #f4efff; --tool-border: #e3d7ff; }
    #hint { --tool-color: #bd7a0b; --tool-bg: #fff7e5; --tool-border: #f2dfb4; }
    .tool .tool-icon { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    .tool:hover { border-color: var(--tool-color); background: var(--tool-bg); }
    .tool:disabled { opacity: .45; cursor: default; }
    .tool.active { border-color: var(--tool-color); color: var(--tool-color); background: var(--tool-bg); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--tool-border); }
    .tool-caption { display: flex; min-width: 0; align-items: center; justify-content: center; gap: 3px; }
    #notes-toggle .tool-caption { flex-direction: column; gap: 1px; }
    .hint-popover {
      position: absolute;
      z-index: 5;
      bottom: calc(100% + 10px);
      left: 50%;
      width: max-content;
      max-width: min(220px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid #f0d28a;
      border-radius: 12px;
      color: #704d08;
      background: #fff8df;
      box-shadow: 0 6px 20px #26395824;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .hint-popover::after {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 9px;
      height: 9px;
      border-right: 1px solid #f0d28a;
      border-bottom: 1px solid #f0d28a;
      background: #fff8df;
      content: "";
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .hint-popover.show { opacity: 1; transform: translate(-50%, 0); }
    .badge { display: inline-grid; min-width: 14px; height: 14px; place-items: center; padding: 0 3px; border-radius: 7px; color: #fff; background: var(--blue); font-size: 8px; font-weight: 800; line-height: 1; }
    #hint .badge { background: #d18a17; }
    .tool-state { padding: 1px 4px; border-radius: 4px; color: #7046c2; background: #e9ddff; font-size: 7px; font-weight: 850; letter-spacing: .02em; line-height: 1.2; }
    .number-pad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
    .score-float {
      position: absolute;
      z-index: 4;
      color: #087f6a;
      font-size: clamp(16px, 4.4vw, 22px);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 1px 4px #fff, 0 0 8px #fff;
      transform: translateX(-50%);
      animation: score-float-up 1.35s cubic-bezier(.22, .61, .36, 1) forwards;
    }
    #score-effects { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    @keyframes score-float-up {
      from { opacity: 0; transform: translate(-50%, 4px) scale(.88); }
      15% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -34px) scale(1); }
    }
    .number-button {
      display: flex;
      flex-direction: column;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0;
      gap: 1px;
      border: 1px solid #e5eaf4;
      border-radius: 10px;
      color: #4569e8;
      background: #fff;
      font-size: 30px;
      font-weight: 700;
      transition: transform .12s ease, background .12s ease;
    }
    .number-button .remaining-count { color: var(--muted); font-size: 9px; font-weight: 750; line-height: 1; }
    .number-button:hover { background: #eef2ff; }
    .number-button.selected { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 3px 10px #4569e84d; }
    .number-button.selected .remaining-count { color: #fff; }
    .number-button:active, .tool:active { transform: scale(.96); }
    .number-button:disabled { opacity: .3; cursor: default; }

    .modal { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: #1b263b66; }
    .modal.show { display: flex; }
    .modal-card { width: min(100%, 360px); padding: 20px; border-radius: 18px; background: #fff; box-shadow: 0 24px 60px #1b263b40; }
    .modal-card h2 { margin: 0 0 14px; font-size: 18px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; color: #707c91; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .field select { padding: 10px 12px; border: 1px solid #e1e6ef; border-radius: 10px; color: #2d3950; background: #fbfcfe; font-size: 14px; font-weight: 650; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-button { min-height: 42px; padding: 9px 10px; border: 1px solid #e1e6ef; border-radius: 10px; color: #536078; background: #fff; font-size: 13px; font-weight: 700; }
    .action-button:hover { background: #f6f8fc; }
    .action-button.primary { grid-column: 1 / -1; border-color: var(--blue); color: #fff; background: var(--blue); }

    .ad-banner-container {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      min-height: calc(50px + env(safe-area-inset-bottom));
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .ad-banner-link {
      display: flex;
      width: 100%;
      max-width: 728px;
      min-height: 50px;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      border-radius: 10px 10px 0 0;
      background: #fff3ec;
      color: #222;
      text-decoration: none;
      box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    }
    .ad-banner-link img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
    .ad-banner-text { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.25; }
    .ad-banner-text small { display: block; color: #ee4d2d; font-weight: 600; }
    .ad-banner-cta { padding: 6px 12px; border-radius: 6px; background: #ee4d2d; color: #fff; font-size: 12px; font-weight: 700; }

    @media (max-width: 380px) {
      .topbar { gap: 5px; padding: 6px; }
      .icon-button { width: 34px; height: 34px; }
      .tool-row { grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 4px; }
      .toolbar { gap: 3px; }
      .tool { min-height: 48px; gap: 3px; padding: 3px 1px; font-size: 9px; }
      .tool .tool-icon { width: 17px; height: 17px; }
      .toast { min-height: 48px; padding: 5px; font-size: 10px; }
      .number-pad { gap: 2px; }
      .number-button { min-height: 48px; font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .score-float { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="stat"><span class="stat-label">Điểm</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">Lỗi</span><span class="stat-value" id="errors">0/3</span></div>
      <div class="timer-row"><span aria-hidden="true">⏱</span><span id="timer">00:00</span></div>
      <div class="menu-control" id="menu-control">
        <button class="menu-button" id="menu-toggle" type="button" aria-expanded="false" aria-controls="game-menu">Menu</button>
        <div class="menu-dropdown" id="game-menu" aria-label="Menu trò chơi" hidden>
          <button type="button" id="menu-pause"><span class="mi" aria-hidden="true">⏸</span>Tạm dừng</button>
          <button type="button" id="menu-resume"><span class="mi" aria-hidden="true">▶</span>Tiếp tục</button>
          <button type="button" id="menu-restart"><span class="mi" aria-hidden="true">↻</span>Chơi lại</button>
          <button type="button" id="menu-new"><span class="mi" aria-hidden="true">✦</span>Đổi bàn mới</button>
        </div>
      </div>
      <button class="icon-button" id="settings" type="button" aria-label="Cài đặt">⚙</button>
    </header>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Bảng Sudoku 9 nhân 9"></div>
      <div class="overlay" id="pause-overlay"><span>Đã tạm dừng</span><button id="resume" type="button">Tiếp tục</button></div>
      <div id="score-effects" aria-hidden="true"></div>
    </div>

    <div class="number-pad" id="number-pad" aria-label="Bàn phím số">
      <button class="number-button" type="button" data-value="1" aria-label="Điền số 1"><span>1</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="2" aria-label="Điền số 2"><span>2</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="3" aria-label="Điền số 3"><span>3</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="4" aria-label="Điền số 4"><span>4</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="5" aria-label="Điền số 5"><span>5</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="6" aria-label="Điền số 6"><span>6</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="7" aria-label="Điền số 7"><span>7</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="8" aria-label="Điền số 8"><span>8</span><span class="remaining-count">9</span></button>
      <button class="number-button" type="button" data-value="9" aria-label="Điền số 9"><span>9</span><span class="remaining-count">9</span></button>
    </div>

    <div class="tool-row">
      <div class="toolbar" aria-label="Công cụ">
      <button class="tool" id="undo" type="button" aria-label="Hoàn tác">
        <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
        <span class="tool-caption">Hoàn tác</span>
      </button>
      <button class="tool" id="erase" type="button" aria-label="Xóa ô đã chọn">
        <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 12 7-8h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H10z"/><path d="m12 10 5 5m0-5-5 5"/></svg>
        <span class="tool-caption">Xóa</span>
      </button>
      <button class="tool" id="notes-toggle" type="button" aria-label="Bật chế độ ghi chú" aria-pressed="false">
        <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m4 16.5-.8 4.3 4.3-.8L20 7.5 16.5 4z"/><path d="m14.8 5.7 3.5 3.5M4 4h7M4 8h5"/></svg>
        <span class="tool-caption"><span>Ghi chú</span><span class="tool-state" id="notes-state">TẮT</span></span>
      </button>
      <button class="tool" id="hint" type="button" aria-label="Gợi ý">
        <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-4-6a7 7 0 1 1 4 0c-.7.5-1 1.1-1 2h-2c0-.9-.3-1.5-1-2Z"/><path d="M12 3v2"/></svg>
        <span class="tool-caption"><span>Gợi ý</span><span class="badge" id="hint-count">3</span></span>
        <span class="hint-popover" id="hint-popover" role="status" aria-live="polite"></span>
      </button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </main>

  <div class="modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card">
      <h2 id="settings-title">Cài đặt</h2>
      <label class="field">Độ khó
        <select id="difficulty">
          <option value="easy">Dễ</option>
          <option value="medium" selected>Vừa</option>
          <option value="hard">Khó</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="action-button" id="restart" type="button">↺ Chơi lại</button>
        <button class="action-button" id="new-game" type="button">✦ Bàn mới</button>
        <button class="action-button" id="check-board" type="button">Kiểm tra kết quả</button>
        <button class="action-button primary" id="close-settings" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <div id="ad-banner-container" class="ad-banner-container">
    <a class="ad-banner-link" id="ad-link" href="#" target="_blank" rel="noopener noreferrer sponsored">
      <img id="ad-image" src="" alt="">
      <span class="ad-banner-text"><span id="ad-title"></span><small id="ad-description"></small></span>
      <span class="ad-banner-cta" id="ad-cta"></span>
    </a>
  </div>

  <script>
    // ================= CẤU HÌNH BANNER QUẢNG CÁO =================
    // Chỉnh các giá trị dưới đây; banner dưới đáy game sẽ tự cập nhật.
    const AD_CONFIG = {
      affiliateUrl: "https://shopee.vn/",   // Dán link affiliate Shopee/Lazada của bạn
      imageUrl: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Crect width='42' height='42' fill='%23ee4d2d'/%3E%3Crect x='7' y='7' width='28' height='28' fill='white'/%3E%3Cpath d='M7 21h28M7 14h28M7 28h28M14 7v28M21 7v28M28 7v28' stroke='%23ee4d2d' stroke-width='1.5'/%3E%3C/svg%3E",   // Link ảnh sản phẩm
      title: "Đồ chơi trí tuệ",             // Tên sản phẩm
      description: "Sách Sudoku giảm giá",  // Mô tả
      buttonText: "Mua ngay"                // Chữ trên nút
    };
    // =============================================================
    (() => {
      const link = document.getElementById("ad-link");
      if (!/^https?:\/\//i.test(AD_CONFIG.affiliateUrl)) { document.getElementById("ad-banner-container").style.display = "none"; return; }
      link.href = AD_CONFIG.affiliateUrl;
      const img = document.getElementById("ad-image");
      img.src = AD_CONFIG.imageUrl;
      img.alt = AD_CONFIG.title;
      document.getElementById("ad-title").textContent = AD_CONFIG.title;
      document.getElementById("ad-description").textContent = AD_CONFIG.description;
      document.getElementById("ad-cta").textContent = AD_CONFIG.buttonText;
    })();
  </script>

  <script>
    (() => {
      "use strict";

      const MAX_ERRORS = 3;
      const MAX_HINTS = 3;
      const boardElement = document.getElementById("board");
      const scoreEffectsElement = document.getElementById("score-effects");
      const timerElement = document.getElementById("timer");
      const toastElement = document.getElementById("toast");
      const toolbarElement = document.querySelector(".toolbar");
      const hintPopover = document.getElementById("hint-popover");
      const difficultyElement = document.getElementById("difficulty");
      const scoreElement = document.getElementById("score");
      const errorsElement = document.getElementById("errors");
      const hintCountElement = document.getElementById("hint-count");
      const notesToggle = document.getElementById("notes-toggle");
      const notesState = document.getElementById("notes-state");
      const pauseOverlay = document.getElementById("pause-overlay");
      const settingsModal = document.getElementById("settings-modal");
      const clueTargets = { easy: 42, medium: 37, hard: 32 };

      let solution = [];
      let puzzle = [];
      let values = [];
      let notes = [];
      let history = [];
      let selectedCell = -1;
      let selectedDigit = 0;
      let invalidCell = -1;
      let elapsedMs = 0;
      let resumedAt = Date.now();
      let paused = false;
      let finished = false;
      let notesMode = false;
      let score = 0;
      let errors = 0;
      let hintsLeft = MAX_HINTS;
      let toastTimeout;
      let hintPopoverTimeout;

      function shuffled(items) {
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function randomizedSolution() {
        const groups = shuffled([0, 1, 2]);
        const rows = groups.flatMap((group) => shuffled([0, 1, 2]).map((row) => group * 3 + row));
        const columns = shuffled([0, 1, 2]).flatMap((group) => shuffled([0, 1, 2]).map((column) => group * 3 + column));
        const digits = shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9]);
        return rows.map((row) => columns.map((column) => digits[(row * 3 + Math.floor(row / 3) + column) % 9]));
      }

      function countSolutions(grid, limit = 2) {
        let bestRow = -1;
        let bestColumn = -1;
        let bestCandidates = null;

        for (let row = 0; row < 9; row += 1) {
          for (let column = 0; column < 9; column += 1) {
            if (grid[row][column] !== 0) continue;
            const used = new Set();
            for (let i = 0; i < 9; i += 1) {
              used.add(grid[row][i]);
              used.add(grid[i][column]);
              used.add(grid[Math.floor(row / 3) * 3 + Math.floor(i / 3)][Math.floor(column / 3) * 3 + i % 3]);
            }
            const candidates = [];
            for (let value = 1; value <= 9; value += 1) {
              if (!used.has(value)) candidates.push(value);
            }
            if (candidates.length === 0) return 0;
            if (bestCandidates === null || candidates.length < bestCandidates.length) {
              bestRow = row;
              bestColumn = column;
              bestCandidates = candidates;
              if (candidates.length === 1) break;
            }
          }
          if (bestCandidates?.length === 1) break;
        }

        if (bestCandidates === null) return 1;
        let total = 0;
        for (const value of bestCandidates) {
          grid[bestRow][bestColumn] = value;
          total += countSolutions(grid, limit - total);
          grid[bestRow][bestColumn] = 0;
          if (total >= limit) return total;
        }
        return total;
      }

      function createPuzzle(difficulty) {
        const answer = randomizedSolution();
        const grid = answer.map((row) => row.slice());
        let clues = 81;
        const cells = shuffled(Array.from({ length: 81 }, (_, index) => index));
        const target = clueTargets[difficulty];

        for (const index of cells) {
          if (clues <= target) break;
          const row = Math.floor(index / 9);
          const column = index % 9;
          const previous = grid[row][column];
          grid[row][column] = 0;
          if (countSolutions(grid) === 1) {
            clues -= 1;
          } else {
            grid[row][column] = previous;
          }
        }
        return { answer, grid };
      }

      function fitToastText() {
        const toolHeight = toolbarElement.getBoundingClientRect().height;
        toastElement.style.height = `${toolHeight}px`;
        toastElement.style.overflow = "hidden";
        let fontSize = 10;
        toastElement.style.fontSize = `${fontSize}px`;
        while (fontSize > 6 && (toastElement.scrollHeight > toastElement.clientHeight || toastElement.scrollWidth > toastElement.clientWidth)) {
          fontSize -= 0.5;
          toastElement.style.fontSize = `${fontSize}px`;
        }
        if (toastElement.scrollHeight > toastElement.clientHeight) {
          toastElement.style.height = "auto";
          toastElement.style.overflow = "visible";
        } else {
          toastElement.style.height = "";
          toastElement.style.overflow = "";
        }
      }

      function setMessage(text, kind = "") {
        window.clearTimeout(toastTimeout);
        window.clearTimeout(hintPopoverTimeout);
        hintPopover.classList.remove("show");
        toastElement.textContent = text;
        toastElement.className = `toast show${kind ? ` ${kind}` : ""}`;
        fitToastText();
        toastTimeout = window.setTimeout(() => toastElement.classList.remove("show"), 3200);
      }

      function showHintPopover(text) {
        window.clearTimeout(toastTimeout);
        toastElement.classList.remove("show");
        window.clearTimeout(hintPopoverTimeout);
        hintPopover.textContent = text;
        hintPopover.classList.add("show");
        hintPopoverTimeout = window.setTimeout(() => hintPopover.classList.remove("show"), 5000);
      }

      function conflictsForGrid() {
        const conflicts = new Set();
        const addDuplicates = (indexes) => {
          const seen = new Map();
          for (const index of indexes) {
            const value = values[index];
            if (!value) continue;
            if (seen.has(value)) {
              conflicts.add(index);
              conflicts.add(seen.get(value));
            } else {
              seen.set(value, index);
            }
          }
        };
        for (let row = 0; row < 9; row += 1) {
          addDuplicates(Array.from({ length: 9 }, (_, column) => row * 9 + column));
        }
        for (let column = 0; column < 9; column += 1) {
          addDuplicates(Array.from({ length: 9 }, (_, row) => row * 9 + column));
        }
        for (let boxRow = 0; boxRow < 3; boxRow += 1) {
          for (let boxColumn = 0; boxColumn < 3; boxColumn += 1) {
            const indexes = [];
            for (let row = 0; row < 3; row += 1) {
              for (let column = 0; column < 3; column += 1) {
                indexes.push((boxRow * 3 + row) * 9 + boxColumn * 3 + column);
              }
            }
            addDuplicates(indexes);
          }
        }
        return conflicts;
      }

      function renderBoard() {
        const conflicts = conflictsForGrid();
        const selectedValue = selectedCell >= 0 ? values[selectedCell] : 0;
        const fragment = document.createDocumentFragment();

        values.forEach((value, index) => {
          const row = Math.floor(index / 9);
          const column = index % 9;
          const given = puzzle[row][column] !== 0;
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(index);
          cell.setAttribute("role", "gridcell");
          const cellNotes = notes[index];
          const notesLabel = cellNotes.size ? `, ghi chú ${Array.from(cellNotes).sort().join(", ")}` : "";
          cell.setAttribute("aria-label", `Hàng ${row + 1}, cột ${column + 1}${value ? `, số ${value}` : ", ô trống"}${notesLabel}${given ? ", số cho sẵn" : ""}${invalidCell === index ? ", số vừa nhập không hợp lệ" : ""}`);
          if (given) {
            cell.classList.add("given");
            cell.disabled = true;
          }
          if (column === 2 || column === 5) cell.classList.add("box-right");
          if (row === 2 || row === 5) cell.classList.add("box-bottom");
          if (selectedCell >= 0 && (Math.floor(selectedCell / 9) === row || selectedCell % 9 === column ||
              (Math.floor(Math.floor(selectedCell / 9) / 3) === Math.floor(row / 3) && Math.floor((selectedCell % 9) / 3) === Math.floor(column / 3)))) {
            cell.classList.add("peer");
          }
          if (selectedCell === index) cell.classList.add("selected");
          if (value && value === selectedValue) cell.classList.add("same");
          if (!given && value) cell.classList.add("user-entry");
          if (conflicts.has(index)) cell.classList.add("conflict");
          if (invalidCell === index) cell.classList.add("invalid");
          if (value) {
            cell.textContent = String(value);
          } else if (cellNotes.size) {
            const noteGrid = document.createElement("span");
            noteGrid.className = "note-grid";
            for (let note = 1; note <= 9; note += 1) {
              const noteElement = document.createElement("span");
              noteElement.textContent = cellNotes.has(note) ? String(note) : "";
              noteGrid.appendChild(noteElement);
            }
            cell.appendChild(noteGrid);
          }
          fragment.appendChild(cell);
        });

        boardElement.replaceChildren(fragment);
        const digitCounts = Array(10).fill(0);
        values.forEach((value) => { if (value) digitCounts[value] += 1; });
        document.querySelectorAll(".number-button").forEach((button) => {
          const digit = Number(button.dataset.value);
          const remaining = 9 - digitCounts[digit];
          button.classList.toggle("selected", digit === selectedDigit);
          button.querySelector(".remaining-count").textContent = String(remaining);
          button.setAttribute("aria-label", `Điền số ${digit}, còn ${remaining} ô`);
        });
      }

      function currentElapsed() {
        return elapsedMs + (paused || finished ? 0 : Date.now() - resumedAt);
      }

      function updateStats() {
        const seconds = Math.floor(currentElapsed() / 1000);
        timerElement.textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        scoreElement.textContent = String(score);
        errorsElement.textContent = `${errors}/${MAX_ERRORS}`;
        errorsElement.classList.toggle("bad", errors > 0);
        hintCountElement.textContent = String(hintsLeft);
        document.getElementById("hint").disabled = hintsLeft === 0;
        document.getElementById("undo").disabled = history.length === 0;
      }

      function isComplete() {
        return values.every((value, index) => value === solution[Math.floor(index / 9)][index % 9]);
      }

      function violatesRules(index, value) {
        const row = Math.floor(index / 9);
        const column = index % 9;
        for (let i = 0; i < 9; i += 1) {
          const boxIndex = (Math.floor(row / 3) * 3 + Math.floor(i / 3)) * 9 +
            Math.floor(column / 3) * 3 + i % 3;
          if ((i !== column && values[row * 9 + i] === value) ||
              (i !== row && values[i * 9 + column] === value) ||
              (boxIndex !== index && values[boxIndex] === value)) {
            return true;
          }
        }
        return false;
      }

      function pushHistory() {
        history.push({ values: values.slice(), notes: notes.map((set) => new Set(set)), score });
        if (history.length > 200) history.shift();
      }

      function showScoreEffect(index, points) {
        const cell = boardElement.querySelector(`[data-index="${index}"]`);
        if (!cell) return;
        const cellRect = cell.getBoundingClientRect();
        const effectsRect = scoreEffectsElement.getBoundingClientRect();
        const effect = document.createElement("span");
        effect.className = "score-float";
        effect.textContent = `+${points}`;
        effect.style.left = `${cellRect.left - effectsRect.left + cellRect.width / 2}px`;
        effect.style.top = `${cellRect.top - effectsRect.top + cellRect.height / 2}px`;
        effect.addEventListener("animationend", () => effect.remove(), { once: true });
        scoreEffectsElement.appendChild(effect);
      }

      function finishIfComplete() {
        if (isComplete()) {
          elapsedMs = currentElapsed();
          finished = true;
          setMessage("Tuyệt vời! Bạn đã hoàn thành Sudoku.", "success");
          updateStats();
        }
      }

      function enterValue(value) {
        if (finished || paused) return;
        selectedDigit = value || 0;
        document.querySelectorAll(".number-button").forEach((button) => {
          button.classList.toggle("selected", Number(button.dataset.value) === selectedDigit);
        });
        if (selectedCell < 0) {
          setMessage("Hãy chọn một ô trống trước nhé.");
          return;
        }
        const row = Math.floor(selectedCell / 9);
        const column = selectedCell % 9;
        if (puzzle[row][column] !== 0) return;

        if (notesMode && value) {
          if (values[selectedCell]) {
            setMessage("Xóa số chính thức trong ô trước khi thêm ghi chú.");
            return;
          }
          pushHistory();
          if (notes[selectedCell].has(value)) {
            notes[selectedCell].delete(value);
          } else {
            notes[selectedCell].add(value);
          }
          invalidCell = -1;
          setMessage("Đã cập nhật ghi chú cho ô.");
          updateStats();
          renderBoard();
          return;
        }

        if (value && violatesRules(selectedCell, value)) {
          invalidCell = selectedCell;
          errors += 1;
          score = Math.max(0, score - 50);
          if (errors >= MAX_ERRORS) {
            elapsedMs = currentElapsed();
            finished = true;
            setMessage("Bạn đã mắc quá nhiều lỗi. Hãy bắt đầu bàn mới!", "error");
          } else if (errors === 1) {
            setMessage("Số này vi phạm quy tắc hàng, cột hoặc khối 3x3 nên chưa được điền.", "error");
          } else if (errors === 2) {
            showHintPopover("Bạn đã mắc lỗi lần thứ hai. Hãy thử dùng Gợi ý để được trợ giúp nhé!");
          } else {
            setMessage("Số này vi phạm quy tắc hàng, cột hoặc khối 3x3 nên chưa được điền.", "error");
          }
          updateStats();
          renderBoard();
          return;
        }

        if (!value && !values[selectedCell] && notes[selectedCell].size === 0) return;
        pushHistory();
        if (invalidCell === selectedCell) invalidCell = -1;
        values[selectedCell] = value;
        notes[selectedCell].clear();
        if (value) {
          score += 100;
          if (value === solution[row][column]) showScoreEffect(selectedCell, 100);
          setMessage("Chính xác! Tiếp tục thôi.");
        } else {
          setMessage("Đã xóa số trong ô.");
        }
        updateStats();
        renderBoard();
        finishIfComplete();
      }

      function undo() {
        if (finished || paused || history.length === 0) return;
        const last = history.pop();
        values = last.values;
        notes = last.notes;
        score = last.score;
        invalidCell = -1;
        setMessage("Đã hoàn tác.");
        updateStats();
        renderBoard();
      }

      function giveHint() {
        if (finished || paused) return;
        if (hintsLeft === 0) {
          setMessage("Bạn đã dùng hết lượt gợi ý.");
          return;
        }
        let target = selectedCell;
        const solvable = (index) => puzzle[Math.floor(index / 9)][index % 9] === 0 &&
          values[index] !== solution[Math.floor(index / 9)][index % 9];
        if (target < 0 || !solvable(target)) {
          const candidates = values.map((_, index) => index).filter(solvable);
          if (candidates.length === 0) return;
          target = candidates[Math.floor(Math.random() * candidates.length)];
        }
        pushHistory();
        values[target] = solution[Math.floor(target / 9)][target % 9];
        notes[target].clear();
        selectedCell = target;
        invalidCell = -1;
        hintsLeft -= 1;
        score = Math.max(0, score - 20);
        setMessage("Đã điền một ô gợi ý cho bạn.");
        updateStats();
        renderBoard();
        finishIfComplete();
      }

      function setNotesMode(on) {
        notesMode = on;
        notesToggle.classList.toggle("active", on);
        notesToggle.setAttribute("aria-pressed", String(on));
        notesToggle.setAttribute("aria-label", `${on ? "Tắt" : "Bật"} chế độ ghi chú`);
        notesState.textContent = on ? "BẬT" : "TẮT";
      }

      function setPaused(on) {
        if (finished || on === paused) return;
        if (on) {
          elapsedMs = currentElapsed();
        } else {
          resumedAt = Date.now();
        }
        paused = on;
        pauseOverlay.classList.toggle("show", on);
        boardElement.classList.toggle("hidden", on);
        updateStats();
      }

      function resetState() {
        values = puzzle.flat();
        notes = Array.from({ length: 81 }, () => new Set());
        history = [];
        selectedCell = -1;
        invalidCell = -1;
        elapsedMs = 0;
        resumedAt = Date.now();
        finished = false;
        score = 0;
        errors = 0;
        hintsLeft = MAX_HINTS;
        setNotesMode(false);
        paused = true;
        setPaused(false);
        updateStats();
        renderBoard();
      }

      function startNewGame() {
        const generated = createPuzzle(difficultyElement.value);
        solution = generated.answer;
        puzzle = generated.grid;
        resetState();
        setMessage("Chọn một ô trống rồi nhập số bạn muốn.");
      }

      function restartGame() {
        resetState();
        setMessage("Ván chơi đã được đặt lại. Chúc bạn may mắn!");
      }

      boardElement.addEventListener("click", (event) => {
        const cell = event.target.closest(".cell");
        if (!cell || cell.disabled || paused) return;
        selectedCell = Number(cell.dataset.index);
        selectedDigit = values[selectedCell] || 0;
        setMessage("Ô đã chọn. Nhập số từ 1 đến 9.");
        renderBoard();
      });

      document.getElementById("number-pad").addEventListener("click", (event) => {
        const button = event.target.closest("[data-value]");
        if (button) enterValue(Number(button.dataset.value));
      });

      document.getElementById("erase").addEventListener("click", () => enterValue(0));
      document.getElementById("undo").addEventListener("click", undo);
      document.getElementById("hint").addEventListener("click", giveHint);
      notesToggle.addEventListener("click", () => {
        if (finished || paused) return;
        setNotesMode(!notesMode);
        setMessage(notesMode ? "Chế độ ghi chú đang bật. Chọn ô trống rồi nhập số cần ghi chú." : "Chế độ ghi chú đã tắt.");
      });
      const menuControl = document.getElementById("menu-control");
      const menuToggle = document.getElementById("menu-toggle");
      const gameMenu = document.getElementById("game-menu");
      function closeGameMenu() {
        gameMenu.hidden = true;
        menuToggle.setAttribute("aria-expanded", "false");
      }
      menuToggle.addEventListener("click", () => {
        gameMenu.hidden = !gameMenu.hidden;
        menuToggle.setAttribute("aria-expanded", String(!gameMenu.hidden));
      });
      document.getElementById("menu-pause").addEventListener("click", () => { closeGameMenu(); setPaused(true); });
      document.getElementById("menu-resume").addEventListener("click", () => { closeGameMenu(); setPaused(false); });
      document.getElementById("menu-restart").addEventListener("click", () => { closeGameMenu(); restartGame(); });
      document.getElementById("menu-new").addEventListener("click", () => { closeGameMenu(); startNewGame(); });
      document.addEventListener("click", (event) => {
        if (!menuControl.contains(event.target)) closeGameMenu();
      });
      document.getElementById("resume").addEventListener("click", () => setPaused(false));
      window.addEventListener("resize", fitToastText);

      function openSettings() { settingsModal.classList.add("show"); }
      function closeSettings() { settingsModal.classList.remove("show"); }
      document.getElementById("settings").addEventListener("click", openSettings);
      document.getElementById("close-settings").addEventListener("click", closeSettings);
      settingsModal.addEventListener("click", (event) => { if (event.target === settingsModal) closeSettings(); });

      document.getElementById("restart").addEventListener("click", () => { closeSettings(); restartGame(); });
      document.getElementById("new-game").addEventListener("click", () => { closeSettings(); startNewGame(); });
      difficultyElement.addEventListener("change", () => { closeSettings(); startNewGame(); });
      document.getElementById("check-board").addEventListener("click", () => {
        closeSettings();
        if (isComplete()) {
          finishIfComplete();
        } else {
          setMessage("Bảng vẫn còn ô trống hoặc số chưa chính xác.", "error");
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.matches("select, input, textarea, [contenteditable='true']")) return;
        if (event.key === "Escape" && !gameMenu.hidden) { closeGameMenu(); return; }
        if (event.key === "Escape" && settingsModal.classList.contains("show")) { closeSettings(); return; }
        if (paused) return;
        if (/^[1-9]$/.test(event.key)) {
          event.preventDefault();
          enterValue(Number(event.key));
          return;
        }
        if (event.key === "Backspace" || event.key === "Delete" || event.key === "0") {
          event.preventDefault();
          enterValue(0);
          return;
        }
        if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key) || selectedCell < 0) return;
        event.preventDefault();
        const row = Math.floor(selectedCell / 9);
        const column = selectedCell % 9;
        const delta = {
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0],
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1]
        }[event.key];
        let nextRow = row;
        let nextColumn = column;
        for (let attempt = 0; attempt < 81; attempt += 1) {
          nextRow = (nextRow + delta[0] + 9) % 9;
          nextColumn = (nextColumn + delta[1] + 9) % 9;
          const index = nextRow * 9 + nextColumn;
          if (puzzle[nextRow][nextColumn] === 0) {
            selectedCell = index;
            selectedDigit = values[index] || 0;
            renderBoard();
            break;
          }
        }
      });

      window.setInterval(updateStats, 1000);
      startNewGame();
    })();
  </script>
